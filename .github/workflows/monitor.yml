name: Monitor de Estresse de Crédito

on:
  schedule:
    # 11:00 UTC = 08:00 horário de Brasília (sem horário de verão desde 2019)
    - cron: "0 11 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar monitoramento
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/main.py

      - name: Commitar timeline atualizada
        run: |
          git config user.name "credit-watch-bot"
          git config user.email "actions@github.com"
          git add data/eventos.json docs/index.html
          git diff --quiet --cached || git commit -m "Atualização semanal do radar de crédito"
          git push
